<!doctype html>
<meta charset="utf8">
<title>New Block</title>
<link rel="stylesheet" href="/ui/panel.css">
<div class="pane" data-context>
  <h1>New Block</h1>
  <div id="form"><div class="note">Loading types…</div></div>
</div>
<script type="module">
import { get, post, complain, el, typeLabel } from "/ui/api.js";
import { blockIcon, typeIcon } from "/ui/icons.js";

const host = document.getElementById("form");
let types = [];

/*
 * What was selected when the panel was summoned, if anything.
 *
 * The shell reads it before this window exists — a panel is the front window
 * from the moment it appears, so a selection asked for afterwards is this
 * panel's own — and hands it down through `composeWith`, the same arrangement
 * Glance uses and for the same reason.
 *
 * Kept rather than consumed, because it is re-applied when the type changes:
 * choosing a different type after the text arrived should not throw the text
 * away, and the fields are rebuilt from scratch on every change.
 */
let seed = null;

/*
 * Fields are drawn from the type, never from its name.
 *
 * The repo's first invariant, and this is the surface most likely to break it:
 * it would be easy to draw a due-date box "for tasks" and a body box "for
 * notes". Instead every field the type declares is rendered by its `kind`, so a
 * type the user invented this morning composes as well as a built-in one, and
 * renaming Task to Action breaks nothing.
 */
const WIDGETS = {
  text: () => el("input"),
  richtext: () => el("textarea"),
  number: () => { const i = el("input"); i.type = "number"; return i; },
  date: () => { const i = el("input"); i.type = "date"; return i; },
  datespan: () => { const i = el("input"); i.type = "date"; return i; },
  enum: (field) => {
    const s = el("select");
    for (const option of field.options || []) s.appendChild(el("option", null, option));
    return s;
  },
  reference: (field) => referencePicker(field),
};

/*
 * A relationship field: pick blocks of the type it points at.
 *
 * The candidates come from `/blocks?type=<targetType>`, which is the field's
 * own answer to what belongs here — never a guess from the field's name. All
 * three reference fields in this library are `many`, and the format allows
 * either, so this honors the flag rather than assuming.
 *
 * The value is an array of block ids, which is how the producer stores it
 * (`project: ["dfbb8488-…"]`) and therefore what a write has to send.
 */
function referencePicker(field) {
  const box = el("div", "picker");
  box.dataset.key = field.key;
  box.dataset.kind = field.kind;
  box.chosen = [];              // read by create(), in place of .value

  const chips = el("div", "chips");
  const search = el("input");
  search.placeholder = field.many ? "Type to search — pick as many as you like" : "Type to search";
  const list = el("div", "options");
  list.hidden = true;
  box.append(chips, search, list);

  let candidates = [];
  let loaded = false;

  const redrawChips = () => {
    chips.replaceChildren();
    for (const c of box.chosen) {
      const chip = el("span", "chip");
      chip.appendChild(blockIcon(c.kind));
      chip.appendChild(el("span", null, c.title || "(untitled)"));
      const x = el("button", "x", "×");
      x.title = "Remove";
      x.onclick = () => {
        box.chosen = box.chosen.filter((o) => o.id !== c.id);
        redrawChips();
      };
      chip.appendChild(x);
      chips.appendChild(chip);
    }
  };

  const show = (term) => {
    const q = term.trim().toLowerCase();
    const taken = new Set(box.chosen.map((c) => c.id));
    const hits = candidates
      .filter((c) => !taken.has(c.id))
      .filter((c) => !q || (c.title || "").toLowerCase().includes(q))
      .slice(0, 40);
    list.replaceChildren();
    if (!hits.length) {
      list.appendChild(el("div", "empty", loaded ? "Nothing matches." : "Loading…"));
    }
    for (const c of hits) {
      const row = el("button", "option");
      row.type = "button";
      row.appendChild(blockIcon(c.kind));
      row.appendChild(el("span", "title", c.title || "(untitled)"));
      const label = typeLabel(c);
      if (label) row.appendChild(el("span", "meta", label));
      row.onclick = () => {
        // A field that takes one holds one. Replacing rather than refusing is
        // the kinder reading of a second click.
        box.chosen = field.many ? [...box.chosen, c] : [c];
        search.value = "";
        redrawChips();
        show("");
      };
      list.appendChild(row);
    }
    list.hidden = false;
  };

  const load = async () => {
    if (loaded) return;
    try {
      candidates = await get(`/blocks?type=${encodeURIComponent(field.targetType)}&limit=500`);
      loaded = true;
    } catch (err) {
      list.replaceChildren(el("div", "error", String(err.message || err)));
      return;
    }
    show(search.value);
  };

  search.addEventListener("focus", () => { load(); show(search.value); });
  search.addEventListener("input", () => { load(); show(search.value); });
  // Late enough for a click on an option to land first — hiding on blur alone
  // dismisses the list before the thing you were reaching for gets the event.
  search.addEventListener("blur", () => setTimeout(() => { list.hidden = true; }, 180));

  return box;
}

/*
 * The type, with the mark each one declares.
 *
 * A native `<select>` cannot draw anything but text, and the type is the one
 * choice on this form where a picture helps: six words that all look alike
 * against six shapes you recognize without reading. So this is the same
 * construction the reference picker below already uses — a button that opens a
 * list of rows — and it keeps the keyboard: the button is a button, the rows are
 * buttons, and Escape closes the list.
 *
 * `picker.value` is kept as a property so nothing else in this file has to know
 * it stopped being a `<select>`.
 */
function typePicker() {
  const box = el("div", "typepick");
  const button = el("button", "typepick-current");
  const list = el("div", "options");
  list.hidden = true;

  const show = (t) => {
    button.replaceChildren(typeIcon(t.icon), el("span", null, t.name), el("span", "caret", "⌄"));
    box.value = t.id;
  };

  for (const t of types) {
    const row = el("button", "option");
    row.type = "button";
    row.appendChild(typeIcon(t.icon));
    row.appendChild(el("span", "title", t.name));
    row.onclick = () => {
      show(t);
      list.hidden = true;
      fields(t.id);
    };
    list.appendChild(row);
  }

  button.type = "button";
  button.onclick = () => { list.hidden = !list.hidden; };
  box.addEventListener("keydown", (e) => { if (e.key === "Escape") list.hidden = true; });
  // Clicking anywhere else puts it away, the way the document list does.
  document.addEventListener("click", (e) => {
    if (!box.contains(e.target)) list.hidden = true;
  });

  box.append(button, list);
  if (types[0]) show(types[0]);
  return box;
}

async function load() {
  types = await get("/types");
  host.innerHTML = "";

  const picker = typePicker();
  host.append(Object.assign(el("label", null, "Type"), {}), picker);

  const body = el("div");
  body.id = "fields";
  host.appendChild(body);

  const go = el("button", "go", "Create");
  go.onclick = () => create(picker.value, go);
  host.appendChild(go);

  const said = el("div", "note");
  said.id = "said";
  host.appendChild(said);

  fields(picker.value);
}

function fields(typeId) {
  const type = types.find(t => t.id === typeId);
  const box = document.getElementById("fields");
  box.innerHTML = "";
  for (const field of type?.fields || []) {
    const make = WIDGETS[field.kind];
    // A field kind this page has not learned about is skipped rather than
    // guessed at. Rendering it as a text box would invite somebody to type a
    // reference into a string and watch it be discarded on the way in.
    if (!make) continue;
    box.appendChild(el("label", null, field.label || field.key));
    const widget = make(field);
    widget.dataset.key = field.key;
    widget.dataset.kind = field.kind;
    box.appendChild(widget);
  }
  sow();
}

/*
 * The selection, laid into the fields this type happens to have.
 *
 * The split is the one `/capture` makes and the one a person makes by hand: the
 * first line is what the thing is called, and the whole of it is what it says.
 * The body keeps the first line too — a note whose text begins one line below
 * its own opening sentence reads as though something was lost.
 *
 * Which field is which is asked of the type, never of a name: the body is
 * whichever field the type declares as rich text, and the title is the key the
 * format reserves. A type with neither takes nothing, and says so.
 */
function sow() {
  if (!seed) return;
  const box = document.getElementById("fields");
  const body = box.querySelector('[data-kind="richtext"]');
  const title = box.querySelector('[data-key="title"]');
  const first = (seed.split("\n").find((line) => line.trim()) || "").trim();

  if (body) body.value = seed;
  if (title) title.value = first.slice(0, 500);

  const said = document.getElementById("said");
  if (said) {
    said.className = "note";
    if (!body && !title) {
      said.textContent = "Nothing on this type takes text — pick another and it will fill itself in.";
    } else if (!body && seed.trim() !== first) {
      // Honest about what did not fit rather than quietly truncating. The rest
      // is still on the clipboard, and another type would hold it.
      said.textContent = "Only the first line fits this type — it has nowhere to put a body.";
    } else {
      said.textContent = "Filled in from what you had selected.";
    }
  }
  // Where somebody would put the cursor themselves: the title, to check the
  // line that was chosen for it.
  (title || body)?.focus();
}

/** Called by the shell after the panel is summoned. */
window.composeWith = (text) => {
  seed = typeof text === "string" && text.trim() ? text : null;
  if (seed) sow();
};

async function create(typeId, go) {
  const said = document.getElementById("said");
  const properties = {};
  let content = "";
  for (const widget of document.querySelectorAll("#fields [data-key]")) {
    if (widget.dataset.kind === "reference") {
      // Ids, as an array, which is how the producer stores a relationship —
      // and sent only when something was picked, because an empty array is a
      // claim that the field is empty rather than that it was left alone.
      const ids = (widget.chosen || []).map((c) => c.id);
      if (ids.length) properties[widget.dataset.key] = ids;
      continue;
    }
    const value = widget.value?.trim();
    if (!value) continue;
    if (widget.dataset.kind === "richtext") content = value;
    else if (widget.dataset.key === "title") properties.title = value;
    else properties[widget.dataset.key] = value;
  }
  if (!properties.title && !content) {
    said.className = "error";
    said.textContent = "Give it a title or a body.";
    return;
  }
  go.disabled = true;
  said.className = "note";
  said.textContent = "Creating…";
  try {
    // `/write` rather than `/capture`: capture guesses a type from a sentence,
    // and this panel has been told one.
    const made = await post("/write", { kind: "create", blockTypeId: typeId, content, properties });
    said.textContent = `Created “${properties.title || content.slice(0, 40)}”.`;
    // Used. A type change after this should give an empty form, not the text
    // that has already been written down once.
    seed = null;
    for (const widget of document.querySelectorAll("#fields [data-key]")) {
      if (widget.chosen) { widget.chosen = []; widget.querySelector(".chips").replaceChildren(); }
      else widget.value = "";
    }
    void made;
  } catch (err) {
    complain(said, err);
  } finally {
    go.disabled = false;
  }
}

load().catch(err => complain(host, err));
</script>
