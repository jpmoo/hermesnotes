<!doctype html>
<meta charset="utf8">
<title>Hermes Notes Collections</title>
<link rel="stylesheet" href="/ui/panel.css">
<div class="frame">
  <nav class="side" id="side"></nav>
  <main class="pane" id="pane"><div class="note">Loading…</div></main>
</div>
<script type="module">
import { get, post, complain, el, typeLabel } from "/ui/api.js";

const side = document.getElementById("side");
const pane = document.getElementById("pane");
let boards = [];
let current = null;

/*
 * The daemon prepares the board — it decides kind, resolves members, formats
 * dates and works out which columns a table has. This file arranges what it is
 * given and does not second-guess any of it. That is the same division the Mac
 * app keeps, and it is why a collection type this page has never heard of still
 * renders as a list of its members rather than as an error.
 */
async function load() {
  boards = await get("/boards");
  side.innerHTML = "";
  for (const b of boards) {
    const button = el("button", null, b.title);
    button.title = `${b.title} — ${b.kind}`;
    button.onclick = () => show(b.id);
    button.dataset.id = b.id;
    side.appendChild(button);
  }
  const remembered = localStorage.getItem("board");
  await show(remembered && boards.some(b => b.id === remembered) ? remembered : boards[0]?.id);
}

async function show(id) {
  if (!id) { pane.innerHTML = "<div class='note'>No collections yet.</div>"; return; }
  current = id;
  localStorage.setItem("board", id);
  for (const b of side.querySelectorAll("button")) {
    b.setAttribute("aria-current", String(b.dataset.id === id));
  }
  pane.innerHTML = "<div class='note'>Loading…</div>";
  try {
    render(await get(`/board/${id}`));
  } catch (err) {
    complain(pane, err);
  }
}

/*
 * Which shape a collection is drawn in, dispatched exactly as `BoardView.swift`
 * does it. The order matters — a rollup is also a list of members, and a matrix
 * is also a set of cards, so the most specific arrangement has to win.
 *
 * Drawing all of them as one list of titles is what this used to do, and it
 * throws away the only thing that made someone choose the shape. A matrix says
 * *where* a task is; a rollup says what it belongs under.
 */
function render(board) {
  pane.innerHTML = "";
  const h = el("h1", null, board.title);
  h.appendChild(el("span", "kind", board.kind));
  pane.appendChild(h);

  if (board.kind === "calendar") return calendar(board.members || []);
  if (board.table && board.columns?.length) return table(board);
  if (board.rollup) return rollup(board);
  if (board.canvas) return canvas(board);
  if (board.gridded) return grid(board);
  return cards(board.members || [], pane);
}

function table(board) {
  const t = el("table");
  const head = el("tr");
  for (const c of board.columns) head.appendChild(el("th", null, c.label));
  t.appendChild(head);
  for (const row of board.tableRows || []) {
    const tr = el("tr");
    for (const c of board.columns) tr.appendChild(el("td", null, row.cells?.[c.key] ?? ""));
    t.appendChild(tr);
  }
  pane.appendChild(t);
}

/* Days, in order, with what falls on each. The Mac hands this to its AgendaView;
 * the daemon has already formatted every date, so this only has to group. */
function calendar(members) {
  const byDay = new Map();
  for (const m of members) {
    const key = (m.dates && m.dates[0]?.text) || "No date";
    if (!byDay.has(key)) byDay.set(key, []);
    byDay.get(key).push(m);
  }
  if (!byDay.size) { pane.appendChild(el("div", "note", "Nothing on this calendar.")); return; }
  for (const [day, items] of byDay) {
    pane.appendChild(heading(day, items.length));
    cards(items, pane);
  }
}

function heading(label, count) {
  const wrap = el("div", "heading");
  wrap.appendChild(el("span", "pill", label === "—" ? "Ungrouped" : label));
  wrap.appendChild(el("span", null, String(count)));
  wrap.appendChild(el("span", "rule"));
  return wrap;
}

/* Regions in a fixed grid, plus the cards the query matched but nobody placed.
 *
 * The drawer is drawn even when empty, which is deliberate on the Mac and worth
 * keeping: hiding it took the drop target away at exactly the moment it was
 * wanted — there was nowhere to put the first card you wanted out of the grid.
 *
 * The region's color goes on as a tint and a border, not a wash. Hermes already
 * stores these with alpha, so the fill is held well back and the cards sitting
 * on it keep their own opaque background; the border is what actually says
 * which region you are looking at.
 */
function grid(board) {
  const box = el("div", "grid");
  box.style.gridTemplateColumns = `repeat(${board.cols || 1}, 1fr)`;
  box.style.gridTemplateRows = `repeat(${board.rows || 1}, 1fr)`;
  const total = (board.cols || 1) * (board.rows || 1);
  for (let i = 0; i < total; i++) {
    const region = (board.regions || []).find(r => r.index === i);
    if (!region) { box.appendChild(el("div")); continue; }
    const held = board.cells?.[String(i)] || [];
    const cell = el("div", "region");
    const tint = region.color;
    if (tint) {
      cell.style.background = `color-mix(in srgb, ${tint} 45%, transparent)`;
      cell.style.borderColor = tint;
    }
    const head = el("header");
    const bar = el("span", "bar");
    bar.style.background = tint || "var(--accent)";
    head.append(bar, el("span", null, region.title || region.name || ""), el("span", "count", String(held.length)));
    cell.appendChild(head);
    const body = el("div", "body");
    if (held.length) cards(held, body, board.id);
    else body.appendChild(el("div", "empty", "Drop here"));
    cell.appendChild(body);
    dropInto(cell, board.id, i, body);
    box.appendChild(cell);
  }
  pane.appendChild(box);

  const drawer = el("div", "drawer");
  const unplaced = board.drawer || [];
  drawer.appendChild(el("h2", null, unplaced.length ? `Unplaced — ${unplaced.length}` : "Unplaced"));
  const row = el("div", "row");
  if (unplaced.length) cards(unplaced, row, board.id);
  else row.appendChild(el("div", "empty", "Drag a card here to take it off the board"));
  drawer.appendChild(row);
  // null rather than an index: still a member of the collection, just not
  // placed anywhere in the grid. It is the way back out of a region, which
  // otherwise had none.
  dropInto(drawer, board.id, null, row);
  pane.appendChild(drawer);
}

/* Make somewhere accept a card.
 *
 * `into` is the element a dropped card is actually put in, which is not `host`:
 * the whole region is the target you can drop on, but the card belongs in its
 * scrolling body.
 */
function dropInto(host, collectionId, region, into) {
  // Counted, not toggled. `dragleave` fires every time the pointer crosses into
  // a *child* — every card in the region — so a plain add/remove made the
  // outline strobe for the whole drag. Enter and leave come in pairs, so
  // counting them says whether the pointer has really left.
  let depth = 0;
  host.addEventListener("dragenter", (e) => {
    e.preventDefault();
    depth += 1;
    host.classList.add("over");
  });
  host.addEventListener("dragover", (e) => {
    // Both are needed: without preventDefault the browser refuses the drop, and
    // without the effect the cursor says "no" the whole way across.
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
  });
  host.addEventListener("dragleave", () => {
    depth -= 1;
    if (depth <= 0) { depth = 0; host.classList.remove("over"); }
  });
  host.addEventListener("drop", async (e) => {
    e.preventDefault();
    depth = 0;
    host.classList.remove("over");
    const blockId = e.dataTransfer.getData("text/plain");
    if (!blockId) return;

    // Moved here first, written after. Reloading the board to show the result
    // blanked the pane and redrew every region — a card moving one square made
    // the whole matrix flash. The daemon is the authority, but it is going to
    // agree with this, and the one case where it does not is handled below by
    // reloading the truth.
    const card = pane.querySelector(`.card[data-id="${CSS.escape(blockId)}"]`);
    const from = card && card.closest(".region, .drawer");
    if (card && into && from !== host) {
      into.appendChild(card);
      recount(from);
      recount(host);
    }

    try {
      await post("/write", { kind: "move", collectionId, blockId, region });
    } catch (err) {
      complain(pane, err);
      // Only now: the optimistic move was wrong, so replace it with what the
      // daemon actually has rather than leaving a card somewhere it is not.
      await show(current);
    }
  });
}

/* Put a region's header back in step after a card has come or gone. */
function recount(host) {
  if (!host) return;
  const body = host.querySelector(".body") || host.querySelector(".row");
  if (!body) return;
  const n = body.querySelectorAll(".card").length;

  const count = host.querySelector(".count");
  if (count) count.textContent = String(n);
  const heading = host.querySelector("h2");
  if (heading) heading.textContent = n ? `Unplaced — ${n}` : "Unplaced";

  const drawer = host.classList.contains("drawer");
  const empty = body.querySelector(".empty");
  if (n && empty) empty.remove();
  if (!n && !empty) {
    body.appendChild(el("div", "empty",
      drawer ? "Drag a card here to take it off the board" : "Drop here"));
  }
}

/* A tree. `groupBy` splits the top level into headed sections; below that it is
 * children all the way down, however deep the collection nests. */
function rollup(board) {
  const groups = board.groups || [];
  if (!groups.length) { pane.appendChild(el("div", "note", "Nothing rolls up here.")); return; }
  if (board.groupBy) {
    const buckets = new Map();
    for (const g of groups) {
      const key = g.group || "—";
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(g);
    }
    // Ungrouped last, as on the Mac — it is the leftovers, not a category.
    const keys = [...buckets.keys()].filter(k => k !== "—");
    if (buckets.has("—")) keys.push("—");
    for (const key of keys) {
      pane.appendChild(heading(key, buckets.get(key).length));
      for (const g of buckets.get(key)) pane.appendChild(node(g, 0));
    }
    return;
  }
  for (const g of groups) pane.appendChild(node(g, 0));
}

function node(item, depth) {
  const wrap = el("div", "node");
  const self = el("div", "self" + (item.done ? " done" : ""));
  self.appendChild(el("span", "title", item.title || "(untitled)"));
  if (item.due) self.appendChild(el("span", "meta", item.due));
  if (typeLabel(item)) self.appendChild(el("span", "meta", typeLabel(item)));
  openable(self, item.url);
  wrap.appendChild(self);
  // Depth is not capped. A rollup that stopped at two levels would silently
  // hide work, which is the one thing a rollup exists to prevent.
  for (const child of item.children || []) wrap.appendChild(node(child, depth + 1));
  return wrap;
}

/* The arrangement, at the coordinates it was arranged at.
 *
 * Read-only and scaled to fit. Editing a canvas is the fork's job — this panel
 * is for seeing where things are, and a canvas you can only look at is still
 * worth far more than the same cards in a list.
 *
 * Three kinds of thing live here and all three matter: placed blocks, the
 * ephemeral notes that carry their own text and color, and the links between
 * them. Drawing only the blocks — which is what this did first — throws away
 * most of what somebody arranged.
 */
const SIDE = {
  n: (b) => ({ x: b.x + b.w / 2, y: b.y }),
  s: (b) => ({ x: b.x + b.w / 2, y: b.y + b.h }),
  e: (b) => ({ x: b.x + b.w, y: b.y + b.h / 2 }),
  w: (b) => ({ x: b.x, y: b.y + b.h / 2 }),
};

/* Nearest side to a point, for a link that does not name one. Ported with the
 * rest of `LinkGeometry` — see `canvasapp/canvas.js`, which the brief keeps
 * precisely because this arithmetic is easy to get subtly wrong. */
function nearestSide(box, aim) {
  let best = null, bestD = Infinity;
  for (const key of ["n", "s", "e", "w"]) {
    const p = SIDE[key](box);
    const d = (p.x - aim.x) ** 2 + (p.y - aim.y) ** 2;
    if (d < bestD) { bestD = d; best = p; }
  }
  return best;
}

function dashFor(style, w) {
  if (style === "dashed") return `${Math.max(w * 2.5, 3)} ${Math.max(w * 2, 2.5)}`;
  if (style === "dotted") return `${Math.max(w, 1)} ${Math.max(w * 2, 3)}`;
  return "";
}

function canvas(board) {
  const nodes = (board.members || []).filter(m => typeof m.x === "number");
  const notes = board.notes || [];
  const edges = board.edges || [];
  if (!nodes.length && !notes.length) return cards(board.members || [], pane);

  // One table of boxes, blocks and notes together, because a link may join any
  // two of them and does not care which kind it reached.
  const boxes = new Map();
  const put = (id, o) => boxes.set(id, { x: o.x, y: o.y, w: o.w || 200, h: o.h || 120 });
  for (const n of nodes) put(n.id, n);
  for (const n of notes) put(n.id, n);

  const all = [...boxes.values()];
  const minX = Math.min(...all.map(b => b.x));
  const minY = Math.min(...all.map(b => b.y));
  const maxX = Math.max(...all.map(b => b.x + b.w));
  const maxY = Math.max(...all.map(b => b.y + b.h));
  const width = Math.max(maxX - minX, 1);
  const height = Math.max(maxY - minY, 1);

  const surface = el("div", "canvas");
  // Only ever shrink. Blowing a small canvas up to fill the pane would make a
  // deliberate arrangement look like a different one.
  const scale = Math.min(1, (pane.clientWidth - 40) / width);
  surface.style.transform = `scale(${scale})`;
  surface.style.width = `${width}px`;
  surface.style.height = `${height}px`;

  surface.appendChild(links(edges, boxes, minX, minY, width, height));

  for (const n of notes) {
    const card = el("div", "note-card");
    card.style.left = `${n.x - minX}px`;
    card.style.top = `${n.y - minY}px`;
    card.style.width = `${n.w || 200}px`;
    card.style.height = `${n.h || 120}px`;
    if (n.color) {
      card.style.background = n.color;
      // The note carries a fill and not a text color, so the text has to pick
      // one that survives it. Anything else is white-on-cream at some point.
      card.style.color = readableOn(n.color);
    }
    card.textContent = n.text || "";
    surface.appendChild(card);
  }

  for (const n of nodes) {
    const card = el("div", "node-card" + (n.done ? " done" : ""));
    card.style.left = `${n.x - minX}px`;
    card.style.top = `${n.y - minY}px`;
    card.style.width = `${n.w || 280}px`;
    card.style.height = `${n.h || 190}px`;
    if (n.color) { card.style.background = n.color; card.style.color = readableOn(n.color); }
    card.appendChild(el("div", "title", n.title || "(untitled)"));
    for (const d of n.dates || []) card.appendChild(el("span", "meta" + (d.overdue ? " overdue" : ""), d.text));
    const nlabel = typeLabel(n) || n.kind || "";
    if (nlabel) card.appendChild(el("span", "meta", nlabel));
    openable(card, n.url);
    surface.appendChild(card);
  }

  const hold = el("div");
  // The wrapper carries the scaled height, because a transform does not change
  // how much room an element asks for and the pane would not scroll.
  hold.style.height = `${height * scale}px`;
  hold.appendChild(surface);
  pane.appendChild(hold);
}

/* The links, as one SVG under everything else.
 *
 * Geometry ported from `LinkGeometry` via `canvasapp/canvas.js`: anchors are
 * side-centres, the control point is the midpoint plus *twice* the bend, and
 * the curve itself passes through midpoint plus the bend. Getting the factor of
 * two wrong bulges every line inward and lands it on the far side of the box.
 */
function links(edges, boxes, minX, minY, width, height) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("class", "links");
  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

  for (const link of edges) {
    const A = boxes.get(link.from);
    const B = boxes.get(link.to);
    if (!A || !B) continue;  // an end that is not on this canvas
    const bx = link.bendX ?? 0;
    const by = link.bendY ?? 0;
    const aim = {
      x: (A.x + A.w / 2 + B.x + B.w / 2) / 2 + bx,
      y: (A.y + A.h / 2 + B.y + B.h / 2) / 2 + by,
    };
    const a = link.fromSide && SIDE[link.fromSide] ? SIDE[link.fromSide](A) : nearestSide(A, aim);
    const b = link.toSide && SIDE[link.toSide] ? SIDE[link.toSide](B) : nearestSide(B, aim);
    const shift = (p) => ({ x: p.x - minX, y: p.y - minY });
    const s = shift(a), e = shift(b);
    // Solved from the anchors, not the centres — the midpoint of two centres is
    // the midpoint of two anchors only when the boxes match.
    const mid = { x: (s.x + e.x) / 2, y: (s.y + e.y) / 2 };
    const control = { x: mid.x + 2 * bx, y: mid.y + 2 * by };

    const width_ = link.width || 1.5;
    const color = link.color || "currentColor";
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", `M ${s.x} ${s.y} Q ${control.x} ${control.y} ${e.x} ${e.y}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", width_);
    const dash = dashFor(link.dash, width_);
    if (dash) path.setAttribute("stroke-dasharray", dash);
    svg.appendChild(path);

    // The arrowhead points the way the curve arrives, which is the tangent at
    // the end — not the straight line between the boxes.
    if (link.arrow && link.arrow !== "none") {
      const dx = 2 * (e.x - control.x);
      const dy = 2 * (e.y - control.y);
      const angle = Math.atan2(dy, dx);
      const size = Math.max(7, width_ * 4);
      const head = document.createElementNS(NS, "path");
      head.setAttribute("d",
        `M ${e.x} ${e.y} ` +
        `L ${e.x - size * Math.cos(angle - 0.4)} ${e.y - size * Math.sin(angle - 0.4)} ` +
        `L ${e.x - size * Math.cos(angle + 0.4)} ${e.y - size * Math.sin(angle + 0.4)} Z`);
      head.setAttribute("fill", color);
      svg.appendChild(head);
    }

    if (link.label) {
      const text = document.createElementNS(NS, "text");
      // Where the curve actually passes, which is midpoint plus the bend — not
      // the control point, which is twice as far out and not on the line.
      text.setAttribute("x", mid.x + bx);
      text.setAttribute("y", mid.y + by - 4);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("class", "link-label");
      text.textContent = link.label;
      svg.appendChild(text);
    }
  }
  return svg;
}

/* Black or white, whichever survives the fill behind it. Hermes stores canvas
 * colors with alpha, so this composites onto the panel's own ground first. */
function readableOn(hex) {
  const m = /^#?([0-9a-f]{6})([0-9a-f]{2})?$/i.exec(hex || "");
  if (!m) return "";
  const n = parseInt(m[1], 16);
  const a = m[2] ? parseInt(m[2], 16) / 255 : 1;
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => c * a + 255 * (1 - a));
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#111" : "#fff";
}

/*
 * Clicking it goes to the thing it stands for.
 *
 * The shell intercepts the navigation and decides where it lands — the Hermes
 * window for a block in this library, a browser for anything else — which is
 * `Opener` on the Mac, and the same split. The page only has to say where.
 */
function openable(node, url) {
  if (!url) return;
  node.classList.add("opens");
  node.title = "Open in Hermes Notes";
  node.addEventListener("click", (e) => {
    // A click on the completion box is about the box. Without this, ticking
    // something off also navigated away from the board you were working in.
    if (e.target.closest(".tick, button")) return;
    window.location.href = url;
  });
}

function cards(members, host, movableIn) {
  if (!members.length) { host.appendChild(el("div", "note", "Nothing in this collection.")); return; }
  for (const m of members) {
    const card = el("div", "card" + (m.done ? " done" : ""));
    card.dataset.id = m.id;
    // Draggable only where there is somewhere to drag to. A card in a plain
    // list that follows the pointer and then refuses to land is worse than one
    // that never moved.
    if (movableIn) {
      card.draggable = true;
      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", m.id);
        e.dataTransfer.effectAllowed = "move";
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", () => card.classList.remove("dragging"));
    }

    // Completion is read through the daemon's `done`, never by comparing a type
    // name. The repo's first invariant: `if (type.name === "Task")` is a bug,
    // and a checkbox drawn only for things called Task would be exactly that.
    if (typeof m.done === "boolean" && m.completable !== false) {
      const tick = el("button", "tick", m.done ? "☑" : "☐");
      tick.title = m.done ? "Completed" : "Mark complete";
      tick.onclick = async () => {
        tick.disabled = true;
        try {
          await post("/write", { kind: "complete", blockId: m.id });
          await show(current);
        } catch (err) { complain(pane, err); }
      };
      card.appendChild(tick);
    }

    const title = el("span", "title", m.title || "(untitled)");
    // The whole title, for when the visible one has been cut short. Set on the
    // span rather than the card: `openable` puts "Open in Hermes Notes" on the
    // card, and the nearer tooltip is the one that shows — so the title wins
    // where the title is, and the action wins everywhere else on the card.
    title.title = m.title || "";
    card.appendChild(title);
    for (const d of m.dates || []) {
      card.appendChild(el("span", "meta" + (d.overdue ? " overdue" : ""), d.text));
    }
    const label = typeLabel(m) || m.kind || "";
    if (label) card.appendChild(el("span", "meta", label));
    openable(card, m.url);
    host.appendChild(card);
  }
}

load().catch(err => complain(pane, err));
</script>
