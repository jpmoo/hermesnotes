<!doctype html>
<meta charset="utf8">
<title>Noticed</title>
<link rel="stylesheet" href="/ui/panel.css">

<!--
  What the machine noticed while nobody was asking.

  AMBIENT's fifth capability, and its posture: "delivered as a review queue and
  **never written**". So there are exactly two things to do with a row — look at
  the block it is about, or say no. Acting on one happens in Hermes, by a
  person, through the paths that already exist.

  Saying no is a decision, and this shows both halves of it. A dismissal is not
  a delete: the row stays, with the time it was dismissed on it, and the second
  tab is where you go to disagree with your past self. Which matters more here
  than it would in most queues — these rows are guesses, some of them made by a
  model, and "no" at 11pm is not always the same answer as "no" the next
  morning.
-->

<div class="chat">
  <header class="chat-head">
    <span class="dot"></span>
    <span class="who-title">Noticed</span>
    <span class="fine" id="count"></span>
    <span class="tabs" id="tabs">
      <button class="tab on" data-view="waiting">Waiting</button>
      <button class="tab" data-view="dismissed">Dismissed</button>
    </span>
  </header>
  <div class="pane" id="body" data-context>
    <div class="note">Reading…</div>
  </div>
</div>

<script type="module">
import { get, post, complain, el } from "/ui/api.js";

const body = document.getElementById("body");
const count = document.getElementById("count");
const tabs = document.getElementById("tabs");

/* What each kind is, in the fewest words that are still true. Shown as the row's
 * label, because "same-title" means nothing on its own and "2 blocks share this
 * title" is the whole observation. */
const KINDS = {
  stale: "Overdue and untouched",
  "same-title": "Two things, one name",
  "to-task": "Sounds like something to do",
};

/** Which half is on screen. */
let view = "waiting";

/** "3 days ago", roughly — enough to tell last night from last month. */
function ago(iso) {
  const then = Date.parse(iso || "");
  if (!Number.isFinite(then)) return "";
  const days = Math.floor((Date.now() - then) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return `${days} days ago`;
  const months = Math.round(days / 30);
  return months === 1 ? "a month ago" : `${months} months ago`;
}

function empty() {
  const box = el("div", "placeholder");
  if (view === "dismissed") {
    box.appendChild(el("p", null, "Nothing dismissed."));
    box.appendChild(el("p", "fine",
      "Whatever you say no to lands here rather than disappearing, so a hasty " +
      "no is recoverable."));
    body.appendChild(box);
    return;
  }
  box.appendChild(el("p", null, "Nothing to look at."));
  box.appendChild(el("p", "fine",
    "This fills itself in the background — overdue tasks nobody has touched, two blocks " +
    "wearing one name, a line in a note that reads like something you meant to do. " +
    "Nothing here is ever written to the library; acting on one is your job, in Hermes."));
  body.appendChild(box);
}

async function draw() {
  const dismissed = view === "dismissed";
  let rows;
  try {
    rows = await get(dismissed ? "/proposals?dismissed=1" : "/proposals");
  } catch (err) {
    return complain(body, err);
  }
  body.replaceChildren();
  // The count is about the queue, not about the tab being looked at — it is the
  // same number the tray badge shows, and having it change meaning when you
  // switch tabs would make the two disagree.
  if (!dismissed) count.textContent = rows.length ? `${rows.length} waiting` : "";

  if (!rows.length) return empty();

  for (const row of rows) {
    const card = el("div", "card noticed" + (dismissed ? " dropped" : ""));
    card.appendChild(el("span", "kind", KINDS[row.kind] ?? row.kind));
    card.appendChild(el("span", "title", row.title || row.block?.title || "(untitled)"));
    if (row.detail) card.appendChild(el("span", "why", row.detail));
    if (dismissed) card.appendChild(el("span", "when", `Dismissed ${ago(row.dismissed)}`));

    const doing = el("div", "doing");
    if (row.block?.url) {
      const open = el("button", "quiet", "Open");
      open.title = "Open it in Hermes Notes";
      open.onclick = () => { window.location.href = row.block.url; };
      doing.appendChild(open);
    }

    const act = el("button", "quiet", dismissed ? "Bring it back" : "Dismiss");
    act.title = dismissed
      ? "Put it back in the queue"
      : "Dismiss — it stops appearing here, and stays on the other tab";
    act.onclick = async () => {
      act.disabled = true;
      try {
        await post(`/proposals/${row.id}/${dismissed ? "restore" : "dismiss"}`, {});
        card.remove();
        if (!dismissed) {
          const left = body.querySelectorAll(".card").length;
          count.textContent = left ? `${left} waiting` : "";
          if (!left) void draw();
        } else {
          // Restoring changes the *other* tab's number, which is the one on
          // screen, so it is re-read rather than counted here.
          try { count.textContent = (await get("/proposals")).length + " waiting"; } catch {}
          if (!body.querySelectorAll(".card").length) empty();
        }
      } catch (err) {
        complain(body, err);
      }
    };
    doing.appendChild(act);
    card.appendChild(doing);
    body.appendChild(card);
  }
}

for (const tab of tabs.querySelectorAll(".tab")) {
  tab.onclick = () => {
    if (view === tab.dataset.view) return;
    view = tab.dataset.view;
    for (const other of tabs.querySelectorAll(".tab")) other.classList.toggle("on", other === tab);
    body.replaceChildren(el("div", "note", "Reading…"));
    void draw();
  };
}

// Re-read on every summon: the panel is hidden rather than closed, and a queue
// showing what was there an hour ago is a queue arguing with itself.
window.proposalsRefresh = () => void draw();
void draw();
</script>
