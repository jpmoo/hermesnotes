<!doctype html>
<meta charset="utf8">
<title>Writing</title>
<link rel="stylesheet" href="/ui/panel.css">

<!--
  The third surface: somewhere to write.

  It sits on the far side of the desk on purpose, and the placeholder it
  replaces said why: "the canvas is where things are arranged and this is where
  they are written, and putting them either side of home means one gesture
  reaches each."

  **Nothing here touches Hermes Notes.** No blocks, no types, no interchange,
  and no daemon — `/shell/writing` is answered by `scheme.py` out of a directory
  of Markdown files, so this surface works with the daemon stopped and the
  network down. That is the whole specification: a blank page with real tools, a
  document that saves itself, and no opinion about what you are writing.

  What it *does* keep is the desk it lives on. Every Talaria hotkey still works
  over it, because those are the compositor's; the swipe between surfaces is
  handed up by `api.js`; and Glance can read it, because the page marks its
  content with `data-context` like every other page here — so pressing the
  Glance key while writing asks the library about what is on the page.
-->

<div class="writer">
  <header class="tools" id="tools">
    <button class="doc" id="doc" title="Documents">
      <span id="docname">Untitled</span><span class="caret">⌄</span>
    </button>

    <span class="tsep"></span>

    <select id="style" title="Paragraph style" aria-label="Paragraph style">
      <option value="p">Normal</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
      <option value="blockquote">Quote</option>
      <option value="pre">Code</option>
      <option value="calc">Calculation</option>
    </select>

    <select id="font" title="Typeface" aria-label="Typeface">
      <option value="system">System</option>
      <option value="serif">Serif</option>
      <option value="verdana">Verdana</option>
      <option value="mono">Monospace</option>
    </select>

    <select id="size" title="Text size" aria-label="Text size">
      <option value="13">13</option>
      <option value="14">14</option>
      <option value="15">15</option>
      <option value="16">16</option>
      <option value="18">18</option>
      <option value="20">20</option>
      <option value="24">24</option>
    </select>

    <span class="tsep"></span>

    <button data-cmd="bold" title="Bold  (Ctrl+B)" aria-label="Bold"><b>B</b></button>
    <button data-cmd="italic" title="Italic  (Ctrl+I)" aria-label="Italic"><i>I</i></button>
    <button data-cmd="underline" title="Underline  (Ctrl+U)" aria-label="Underline"><u>U</u></button>
    <button data-cmd="strikeThrough" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>

    <span class="tsep"></span>

    <button data-list="ul" title="Bulleted list" aria-label="Bulleted list">&bull;</button>
    <button data-list="ol" title="Numbered list" aria-label="Numbered list">1.</button>
    <button data-list="check" title="Checklist" aria-label="Checklist">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1.5" y="2" width="7" height="7" rx="1.6"/>
        <path d="M3.2 5.6 4.6 7l2.4-2.7"/>
        <path d="M11 4h3.5M11 11.5h3.5M1.5 11.5h7"/>
      </svg>
    </button>
    <button id="table" title="Insert a table" aria-label="Insert a table">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.3">
        <rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/>
        <path d="M1.5 6.2h13M6 6.2v7.3M10.5 6.2v7.3"/>
      </svg>
    </button>
    <button data-cmd="outdent" title="Outdent  (Shift+Tab)" aria-label="Outdent">⇤</button>
    <button data-cmd="indent" title="Indent  (Tab)" aria-label="Indent">⇥</button>

    <span class="tsep"></span>

    <button id="link" title="Link" aria-label="Link">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.3-2.3a2.6 2.6 0 0 0-3.7-3.7l-1 1"/>
        <path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.4 8.9a2.6 2.6 0 0 0 3.7 3.7l1-1"/>
      </svg>
    </button>
    <button data-cmd="removeFormat" title="Clear formatting" aria-label="Clear formatting">✕</button>

    <span class="grow"></span>
    <span class="fine" id="count"></span>
    <span class="state" id="state"></span>
  </header>

  <!--
    Shown only with the caret in a table. A row of seven controls that are
    meaningless the rest of the time is worse than a row that appears when it
    applies — and a table is the one thing here you cannot edit with the
    keyboard alone.
  -->
  <div class="tabletools" id="tabletools" hidden>
    <button data-table="row-above" title="Insert a row above">Row ↑</button>
    <button data-table="row-below" title="Insert a row below">Row ↓</button>
    <button data-table="col-left" title="Insert a column to the left">Col ←</button>
    <button data-table="col-right" title="Insert a column to the right">Col →</button>
    <span class="tsep"></span>
    <button data-table="align" title="Align this column: left, center, right">Align</button>
    <span class="tsep"></span>
    <button data-table="drop-row" title="Delete this row">Delete row</button>
    <button data-table="drop-col" title="Delete this column">Delete column</button>
    <button data-table="drop" title="Delete the whole table">Delete table</button>
  </div>

  <!-- `data-context` is the whole of Glance's access to this surface: the page
       it holds, and none of the furniture above. -->
  <div class="sheet" id="sheet">
    <div class="page" id="page" contenteditable="true" spellcheck="true" data-context></div>
  </div>

  <div class="doclist" id="doclist" hidden></div>
</div>

<script type="module">
import { get, post, put, el } from "/ui/api.js";
import { fromMarkdown, toMarkdown } from "/ui/richtext.js";
import { run as reckon, looksArithmetic } from "/ui/calc.js";

const page = document.getElementById("page");
const state = document.getElementById("state");
const count = document.getElementById("count");
const docname = document.getElementById("docname");
const doclist = document.getElementById("doclist");
const style = document.getElementById("style");

/** The document on screen. `text` is what was last written to disk. */
let open = { name: "Untitled.md", text: "" };

/*
 * On the desk this page is a frame, and an off-screen one at that.
 *
 * Nothing here may take focus on load. `api.js` blurs whatever a framed panel
 * autofocused, and states the reason: four panes race, one wins, and the browser
 * scrolls to reveal a caret nobody was looking at — which is how the desk ended
 * up 1599 pixels sideways. This surface is two screens over when the desk
 * opens, so it would be the worst offender of the four.
 */
const framed = window.parent !== window;

/*
 * Semantic tags, not inline styles.
 *
 * `styleWithCSS` on turns Bold into `<span style="font-weight: bold">`, which
 * serializes to nothing at all — the Markdown that comes back out is plain
 * text, and the emphasis is gone the next time the file is opened. Off, the
 * browser produces `<b>` and `<i>`, which `richtext.js` knows how to say.
 *
 * `defaultParagraphSeparator` for the same reason one level up: the default is
 * `<div>`, and a document of divs round-trips as one unbroken paragraph.
 */
document.execCommand("styleWithCSS", false, "false");
document.execCommand("defaultParagraphSeparator", false, "p");

/* ------------------------------------------------------- how it is set */

/*
 * The typeface and the size, which belong to the surface and not to the file.
 *
 * Markdown has nowhere to record either, and it should not: what a document
 * *says* and what it looks like while somebody writes it are different
 * questions, and only the first one is worth keeping in a file that other
 * programs will read. So these live in the browser's own storage, per surface,
 * and every document opens the way the last one was left.
 *
 * The four faces are the ones this project already has an opinion about. Verdana
 * is Hermes' body face — the brand is explicit about it and `canvas.css` says so
 * — and the system stack is the desktop's own choice, which is what the rest of
 * the shell uses. Serif and monospace are here because writing is not chrome and
 * some people cannot think in a UI font.
 */
const FACES = {
  system: 'system-ui, "Noto Sans", sans-serif',
  /*
   * The reading face, and `P052` is the load-bearing name in it.
   *
   * Chromium does not honour fontconfig's aliases for a CSS family it does not
   * know: `Palatino` resolves to P052 at the `fc-match` level and to *nothing*
   * in the browser, so the stack fell through to the generic serif — measured,
   * by rendering the same string in each and comparing widths. P052 is URW's
   * Palatino, it ships in `fonts-urw-base35`, and naming it outright is what
   * makes this actually Palatino on Linux rather than Noto Serif wearing the
   * request. The Mac and Windows names stay in front of it, where they are the
   * real thing.
   */
  serif: '"Iowan Old Style", "Palatino Linotype", Palatino, P052, Georgia, "Noto Serif", serif',
  verdana: 'Verdana, "DejaVu Sans", sans-serif',
  mono: 'ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace',
};

const font = document.getElementById("font");
const size = document.getElementById("size");

/** Remembered, and never fatal. A private window has no storage at all. */
function remember(key, value) {
  try { localStorage.setItem(`talaria.writing.${key}`, value); } catch { /* fine */ }
}
function remembered(key, fallback) {
  try { return localStorage.getItem(`talaria.writing.${key}`) ?? fallback; } catch { return fallback; }
}

function dressed() {
  const face = FACES[font.value] ? font.value : "system";
  page.style.setProperty("--writing-font", FACES[face]);
  page.style.setProperty("--writing-size", `${size.value}px`);
  remember("font", face);
  remember("size", size.value);
}

font.value = remembered("font", "system");
size.value = remembered("size", "15");
if (!FACES[font.value]) font.value = "system";
if (![...size.options].some((o) => o.value === size.value)) size.value = "15";
font.onchange = () => { dressed(); page.focus(); };
size.onchange = () => { dressed(); page.focus(); };
dressed();

/* ---------------------------------------------------------------- saving */

let timer = null;
let dirty = false;

function said(text, bad = false) {
  state.textContent = text;
  state.classList.toggle("bad", bad);
}

function counted() {
  const words = (page.innerText.match(/\S+/g) || []).length;
  count.textContent = words ? `${words} word${words === 1 ? "" : "s"}` : "";
}

/**
 * Save, and say so.
 *
 * On a timer rather than on a button, because the one thing a writing surface
 * must never do is lose what somebody wrote. The button exists anyway (Ctrl+S),
 * for the feeling of it.
 */
async function save() {
  clearTimeout(timer);
  timer = null;
  const text = toMarkdown(page);
  if (!dirty && text === open.text) return;
  said("Saving…");
  try {
    await put("/shell/writing", { name: open.name, text });
    open.text = text;
    dirty = false;
    said("Saved");
  } catch (err) {
    // Loudly, and it stays on screen. A silent failure here is the difference
    // between an afternoon's work and no afternoon's work — and the text is
    // still in front of you, which is the one saving grace worth saying.
    said(String(err.message || err), true);
  }
}

/*
 * The two invariants a checklist has, restored after every change.
 *
 * `execCommand("indent")` makes a plain `<ul>` even inside a checklist — it has
 * no idea checklists exist — so a nested item lost its box the moment it was
 * indented. Rather than intercepting every command that could do it, the shape
 * is simply made true again afterwards: a list under a checklist is a checklist,
 * and an item in one has a state.
 */
function tidy() {
  /*
   * Chromium leaves styled spans behind.
   *
   * `outdent` on a list item wrapped its text in
   * `<span style="background-color: …">` — the sheet's own translucent fill,
   * copied out of the computed style and pasted inline, so the words came back
   * wearing a box. Nothing here ever makes a styled span, so any that turns up
   * is the browser's and is unwrapped. It would serialize to plain text either
   * way; this is about what the page looks like while it is open.
   */
  for (const span of page.querySelectorAll("span[style]")) {
    span.replaceWith(...span.childNodes);
  }
  /*
   * And it styles the blocks it makes, too.
   *
   * `execCommand("indent")` writes `margin: 0 0 0 40px; border: none` onto the
   * blockquote it creates, which overrides the stylesheet — so an indent looked
   * one way while you made it and another way after the file was reopened,
   * because the copy that comes back from Markdown carries no styles at all.
   * Nothing here ever sets an inline style, so every one of them is the
   * browser's and every one goes.
   */
  for (const styled of page.querySelectorAll("[style]")) styled.removeAttribute("style");
  for (const list of page.querySelectorAll("ul")) {
    if (list.parentElement?.closest('ul[data-check="1"]')) list.dataset.check = "1";
  }
  for (const li of page.querySelectorAll("li")) {
    const checks = li.parentElement?.dataset.check === "1";
    if (checks) li.dataset.done ||= "0";
    else if ("done" in li.dataset) delete li.dataset.done;
  }
}

function touched() {
  tidy();
  markCalc();
  recalc();
  dirty = true;
  counted();
  said("…");
  clearTimeout(timer);
  timer = setTimeout(save, 700);
}

page.addEventListener("input", touched);

/* ---------------------------------------------------------------- opening */

async function load(name) {
  await save();
  let doc;
  try {
    doc = await get(`/shell/writing?name=${encodeURIComponent(name)}`);
  } catch (err) {
    said(String(err.message || err), true);
    return;
  }
  open = { name: doc.name, text: doc.text || "" };
  page.replaceChildren(fromMarkdown(open.text));
  docname.textContent = open.name.replace(/\.md$/, "");
  dirty = false;
  markCalc();
  recalc();
  counted();
  said(doc.new ? "New" : "Saved");
  // The caret goes where somebody would put it, which is the end of what they
  // were last writing — but never on the desk, where this page is off-screen
  // when it loads. There, a click is what says you are here.
  if (framed) return;
  page.focus();
  const last = page.lastElementChild;
  if (last) {
    const range = document.createRange();
    range.selectNodeContents(last);
    range.collapse(false);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

/** A name nothing else is using. */
function fresh(taken) {
  const used = new Set(taken.map((row) => row.name));
  if (!used.has("Untitled.md")) return "Untitled.md";
  for (let n = 2; ; n += 1) if (!used.has(`Untitled ${n}.md`)) return `Untitled ${n}.md`;
}

const WHEN = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });

async function documents() {
  let rows = [];
  try {
    rows = await get("/shell/writing");
  } catch (err) {
    doclist.replaceChildren(el("div", "bad-box", String(err.message || err)));
    return;
  }

  doclist.replaceChildren();
  const head = el("div", "doc-head");
  head.appendChild(el("span", "fine", "~/.local/share/talaria/writing"));
  const add = el("button", "quiet", "New");
  add.onclick = async () => {
    await save();
    open = { name: fresh(rows), text: "" };
    page.replaceChildren(fromMarkdown(""));
    docname.textContent = open.name.replace(/\.md$/, "");
    dirty = true;             // so an empty new document still gets a file
    doclist.hidden = true;
    counted();
    page.focus();
    void save();
  };
  head.appendChild(add);
  doclist.appendChild(head);

  for (const row of rows) {
    const item = el("div", "doc-row" + (row.name === open.name ? " here" : ""));
    const pick = el("button", "doc-open");
    pick.appendChild(el("span", "title", row.name.replace(/\.md$/, "")));
    pick.appendChild(el("span", "fine", WHEN.format(new Date(row.updated * 1000))));
    pick.onclick = () => { doclist.hidden = true; void load(row.name); };
    item.appendChild(pick);

    const rename = el("button", "quiet", "Rename");
    rename.onclick = async () => {
      const to = prompt("Call it:", row.name.replace(/\.md$/, ""));
      if (!to) return;
      try {
        const done = await post("/shell/writing?do=rename", { name: row.name, to });
        if (row.name === open.name) {
          open.name = done.name;
          docname.textContent = done.name.replace(/\.md$/, "");
        }
        void documents();
      } catch (err) {
        said(String(err.message || err), true);
      }
    };
    item.appendChild(rename);

    const drop = el("button", "quiet", "Delete");
    drop.onclick = async () => {
      if (!confirm(`Delete “${row.name.replace(/\.md$/, "")}”? This cannot be undone.`)) return;
      try {
        await post("/shell/writing?do=delete", { name: row.name });
        if (row.name === open.name) {
          // The one on screen went. Rather than leaving a document that no
          // longer exists open and saving it back a moment later, start again.
          const left = (await get("/shell/writing")).filter((r) => r.name !== row.name);
          open = { name: left[0]?.name || "Untitled.md", text: "" };
          dirty = false;
          await load(open.name);
        }
        void documents();
      } catch (err) {
        said(String(err.message || err), true);
      }
    };
    item.appendChild(drop);
    doclist.appendChild(item);
  }
}

document.getElementById("doc").onclick = () => {
  doclist.hidden = !doclist.hidden;
  if (!doclist.hidden) void documents();
};
document.addEventListener("click", (e) => {
  if (!doclist.hidden && !doclist.contains(e.target) && e.target.closest("#doc") === null) {
    doclist.hidden = true;
  }
});

/* ------------------------------------------------------------- the tools */

/** The block the caret is in, as far up as the page itself. */
function block() {
  let node = getSelection()?.anchorNode;
  while (node && node !== page) {
    if (node.nodeType === Node.ELEMENT_NODE && node.parentElement === page) return node;
    node = node.parentNode;
  }
  return null;
}

/** The blockquote the caret is in, if any. */
function inQuote() {
  let node = getSelection()?.anchorNode;
  while (node && node !== page) {
    if (node.nodeType === Node.ELEMENT_NODE && node.tagName === "BLOCKQUOTE") return node;
    node = node.parentNode;
  }
  return null;
}

/** The list the caret is in, if any. */
function inList() {
  let node = getSelection()?.anchorNode;
  while (node && node !== page) {
    if (node.nodeType === Node.ELEMENT_NODE && (node.tagName === "UL" || node.tagName === "OL")) return node;
    node = node.parentNode;
  }
  return null;
}

for (const button of document.querySelectorAll("[data-cmd]")) {
  // `mousedown` rather than `click`, and prevented: a button that takes focus
  // first has already collapsed the selection it was about to act on.
  button.addEventListener("mousedown", (e) => e.preventDefault());
  button.addEventListener("click", () => {
    const cmd = button.dataset.cmd;
    document.execCommand(cmd, false, null);
    page.focus();
    touched();
    reflect();
  });
}

/*
 * The three list kinds, as one control each and a toggle.
 *
 * A checklist is an unordered list wearing `data-check`, not a third kind of
 * node — which is what lets the two conversions be a flag rather than a rebuild,
 * and what lets `richtext.js` write `- [ ]` for one and `-` for the other.
 * `execCommand` has no idea checklists exist; everything else about them is
 * `panel.css` drawing a box and the click handler below toggling it.
 */
for (const button of document.querySelectorAll("[data-list]")) {
  button.addEventListener("mousedown", (e) => e.preventDefault());
  button.addEventListener("click", () => {
    const want = button.dataset.list;
    const list = inList();
    const checks = want === "check";
    const wanted = want === "ol" ? "OL" : "UL";

    if (list && list.tagName === wanted && (list.dataset.check === "1") === checks) {
      // Pressing the kind it already is turns the list off.
      document.execCommand(wanted === "OL" ? "insertOrderedList" : "insertUnorderedList", false, null);
    } else if (list && list.tagName === wanted) {
      // Same shape, different marker: a bulleted list becoming a checklist.
      list.dataset.check = checks ? "1" : "";
      if (!checks) for (const li of list.children) delete li.dataset.done;
      else for (const li of list.children) li.dataset.done ||= "0";
    } else {
      document.execCommand(wanted === "OL" ? "insertOrderedList" : "insertUnorderedList", false, null);
      const made = inList();
      if (made) {
        if (checks) {
          made.dataset.check = "1";
          for (const li of made.children) li.dataset.done ||= "0";
        } else {
          delete made.dataset.check;
        }
      }
    }
    page.focus();
    touched();
    reflect();
  });
}

/* --------------------------------------------------------- arithmetic */

/*
 * The document's sums, worked out top to bottom.
 *
 * Two shapes, both Calca's, both plain Markdown: a line `rent = 1850` names a
 * value, and any line carrying `=>` is answered after the arrow. A fenced
 * ```calc block is the same thing for a column of workings, where every line is
 * a question and the arrow can be left off.
 *
 * The answer is written into the line rather than drawn beside it. That is what
 * puts it in the *file* — somebody opening the document in anything else sees
 * the arithmetic and its results — and it is why this must not disturb the
 * caret: the expression's length never changes when only the answer does, so a
 * caret inside the expression stays exactly where it was, and the one case that
 * moves is a caret parked in the answer, which is not a place to type.
 */
function recalc() {
  const units = [];
  const collect = (root) => {
    for (const node of root.children) {
      if (node.tagName === "PRE") {
        const code = node.querySelector("code");
        if (code?.dataset.language === "calc") units.push({ node: code, block: true });
        continue;
      }
      if (node.classList?.contains("calc")) { units.push({ node, block: false }); continue; }
      // A calculation can live inside a quote or a list item, so this goes down.
      if (["BLOCKQUOTE", "UL", "OL", "LI", "DIV"].includes(node.tagName)) collect(node);
    }
  };
  collect(page);
  if (!units.length) return;

  // One scope across the whole document, in reading order: a name means
  // whatever it was last set to above the line using it.
  const source = [];
  const owns = [];
  for (const unit of units) {
    const lines = unit.block ? unit.node.textContent.split("\n") : [unit.node.textContent];
    for (const line of lines) { source.push(line); owns.push(unit); }
    unit.lines = lines;
  }
  const answers = reckon(source, { bare: true });

  // Put each unit back together, and only touch the ones that changed.
  let at = 0;
  for (const unit of units) {
    const rebuilt = unit.lines.map((line) => {
      const answer = answers[at++];
      if (!answer) return line;
      const head = line.split("=>")[0].replace(/\s+$/, "");
      if (answer.error) {
        // A line that was *asked* — it carries an arrow — says why it cannot be
        // worked out. A bare line inside a block that is simply not arithmetic
        // says nothing at all.
        return answer.quiet ? line : `${head} => ${answer.error}`;
      }
      return `${head} => ${answer.text}`;
    });
    const next = rebuilt.join("\n");
    if (next === unit.node.textContent) continue;
    keepingCaret(unit.node, () => { unit.node.textContent = next; });
  }
}

/**
 * Rewrite a node's text without losing the caret.
 *
 * The offset is counted from the start of the node, and the part of the line in
 * front of the answer never moves — so a caret in the expression lands back on
 * the same character. One clamped to the new length is the honest answer for a
 * caret that was sitting in an answer that has since got shorter.
 */
function keepingCaret(node, change) {
  const sel = getSelection();
  const inside = sel && sel.anchorNode && node.contains(sel.anchorNode);
  let offset = 0;
  if (inside) {
    const range = document.createRange();
    range.selectNodeContents(node);
    range.setEnd(sel.anchorNode, sel.anchorOffset);
    offset = range.toString().length;
  }
  change();
  if (!inside) return;
  const text = node.firstChild;
  if (!text) return;
  const range = document.createRange();
  range.setStart(text, Math.min(offset, text.length ?? 0));
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

/*
 * A line becomes arithmetic the moment it reads as arithmetic.
 *
 * Marked on the paragraph rather than decided line by line at save time, so the
 * serializer can write it verbatim — an expression is made of the characters
 * Markdown escapes, and `rent \* 12` is not what anybody typed.
 */
function markCalc() {
  for (const node of page.querySelectorAll("p, li")) {
    const text = node.textContent;
    const arithmetic = /^\s*[A-Za-z_][A-Za-z0-9_]*\s*=(?!=)/.test(text)
      || (text.includes("=>") && looksArithmetic(text.split("=>")[0]));
    node.classList.toggle("calc", arithmetic && node.tagName === "P");
  }
}

/* ------------------------------------------------------------- tables */

/*
 * Tables, which are the one block here with a shape rather than a prefix.
 *
 * `execCommand` has nothing for them — no insertTable, no row or column verbs —
 * so every one of these is DOM work. That is fine and even preferable: a table
 * in Markdown is a rectangle, and keeping it rectangular is most of the job.
 * Every operation below ends by making sure every row is the same width.
 */
const tabletools = document.getElementById("tabletools");

/** The cell the caret is in, and the table around it. */
function inCell() {
  let node = getSelection()?.anchorNode;
  while (node && node !== page) {
    if (node.nodeType === Node.ELEMENT_NODE && (node.tagName === "TD" || node.tagName === "TH")) {
      return node;
    }
    node = node.parentNode;
  }
  return null;
}

function caretInto(cell) {
  if (!cell) return;
  const range = document.createRange();
  range.selectNodeContents(cell);
  range.collapse(true);
  const sel = getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  page.focus();
}

/** A blank cell of the right kind, carrying the column's alignment. */
function blank(kind, align) {
  const cell = document.createElement(kind);
  if (align) cell.dataset.align = align;
  cell.appendChild(document.createElement("br"));
  return cell;
}

function insertTable(columns = 3, rows = 2) {
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  const hrow = document.createElement("tr");
  for (let c = 0; c < columns; c += 1) hrow.appendChild(blank("th"));
  thead.appendChild(hrow);
  const tbody = document.createElement("tbody");
  for (let r = 0; r < rows; r += 1) {
    const tr = document.createElement("tr");
    for (let c = 0; c < columns; c += 1) tr.appendChild(blank("td"));
    tbody.appendChild(tr);
  }
  table.append(thead, tbody);

  // In place of the block the caret is in when that block is empty, and after
  // it otherwise — the same thing a word processor does, and it stops a table
  // from swallowing the sentence somebody was in the middle of.
  const here = block();
  if (here && !here.textContent.trim() && here.tagName !== "TABLE") here.replaceWith(table);
  else if (here) here.after(table);
  else page.appendChild(table);

  // Somewhere to go after it, or a table at the end of the document is a trap.
  if (!table.nextElementSibling) {
    const after = document.createElement("p");
    after.appendChild(document.createElement("br"));
    table.after(after);
  }
  caretInto(table.querySelector("th"));
  touched();
  reflect();
}

/** Every row the same width, whatever was just done to it. */
function square(table) {
  const rows = [...table.querySelectorAll("tr")];
  const width = Math.max(...rows.map((r) => r.children.length));
  for (const row of rows) {
    const kind = row.parentElement?.tagName === "THEAD" ? "th" : "td";
    while (row.children.length < width) row.appendChild(blank(kind));
  }
}

const TABLE_DOES = {
  "row-above": (cell, row, table) => {
    // Never above the heading: a Markdown table's first row *is* the heading,
    // and a body row put in front of it would silently become one.
    const copy = document.createElement("tr");
    for (const c of row.children) copy.appendChild(blank("td", c.dataset.align));
    if (row.parentElement.tagName === "THEAD") table.querySelector("tbody").prepend(copy);
    else row.before(copy);
    caretInto(copy.firstElementChild);
  },
  "row-below": (cell, row, table) => {
    const copy = document.createElement("tr");
    for (const c of row.children) copy.appendChild(blank("td", c.dataset.align));
    if (row.parentElement.tagName === "THEAD") table.querySelector("tbody").prepend(copy);
    else row.after(copy);
    caretInto(copy.firstElementChild);
  },
  "col-left": (cell, row, table) => {
    const at = [...row.children].indexOf(cell);
    for (const r of table.querySelectorAll("tr")) {
      const kind = r.parentElement.tagName === "THEAD" ? "th" : "td";
      r.children[at].before(blank(kind));
    }
    caretInto(row.children[at]);
  },
  "col-right": (cell, row, table) => {
    const at = [...row.children].indexOf(cell);
    for (const r of table.querySelectorAll("tr")) {
      const kind = r.parentElement.tagName === "THEAD" ? "th" : "td";
      r.children[at].after(blank(kind));
    }
    caretInto(row.children[at + 1]);
  },
  align: (cell, row, table) => {
    const at = [...row.children].indexOf(cell);
    const order = ["", "left", "center", "right"];
    const next = order[(order.indexOf(cell.dataset.align || "") + 1) % order.length];
    // Markdown carries alignment per *column*, in the rule under the heading,
    // so setting it on one cell and not the rest would be a thing this file
    // cannot say.
    for (const r of table.querySelectorAll("tr")) {
      const c = r.children[at];
      if (!c) continue;
      if (next) c.dataset.align = next;
      else delete c.dataset.align;
    }
    caretInto(cell);
  },
  "drop-row": (cell, row, table) => {
    if (row.parentElement.tagName === "THEAD") {
      // The heading cannot go on its own — the first body row is promoted into
      // it, and a one-row table is deleted outright.
      const first = table.querySelector("tbody tr");
      if (!first) return table.remove();
      for (const c of [...first.children]) {
        const th = document.createElement("th");
        if (c.dataset.align) th.dataset.align = c.dataset.align;
        th.append(...c.childNodes);
        c.replaceWith(th);
      }
      row.replaceWith(first);
      return caretInto(first.firstElementChild);
    }
    const next = row.nextElementSibling || row.previousElementSibling;
    row.remove();
    caretInto((next || table.querySelector("th"))?.firstElementChild);
  },
  "drop-col": (cell, row, table) => {
    const at = [...row.children].indexOf(cell);
    if (row.children.length <= 1) return table.remove();
    for (const r of table.querySelectorAll("tr")) r.children[at]?.remove();
    caretInto(row.children[Math.min(at, row.children.length - 1)]);
  },
  drop: (cell, row, table) => {
    const after = table.nextElementSibling;
    table.remove();
    if (after) caretInto(after);
  },
};

for (const button of tabletools.querySelectorAll("[data-table]")) {
  button.addEventListener("mousedown", (e) => e.preventDefault());
  button.addEventListener("click", () => {
    const cell = inCell();
    if (!cell) return;
    const row = cell.parentElement;
    const table = cell.closest("table");
    TABLE_DOES[button.dataset.table]?.(cell, row, table);
    if (table.isConnected) square(table);
    touched();
    reflect();
  });
}

document.getElementById("table").addEventListener("mousedown", (e) => e.preventDefault());
document.getElementById("table").onclick = () => insertTable();

style.onchange = () => {
  /*
   * A calculation block is a fenced code block with a language, and
   * `formatBlock` cannot set an attribute — so this one is built rather than
   * commanded. It is the same `pre` the Code style makes, wearing the one word
   * that tells the calculation pass to answer every line in it.
   */
  if (style.value === "calc") {
    const here = block();
    const pre = document.createElement("pre");
    const code = document.createElement("code");
    code.dataset.language = "calc";
    code.textContent = here?.textContent.trim() || "";
    pre.appendChild(code);
    if (here) here.replaceWith(pre); else page.appendChild(pre);
    if (!pre.nextElementSibling) {
      const after = document.createElement("p");
      after.appendChild(document.createElement("br"));
      pre.after(after);
    }
    caretInto(code);
    touched();
    return reflect();
  }
  // `formatBlock` takes the tag in angle brackets, and "p" is how you get back
  // out of a heading.
  document.execCommand("formatBlock", false, `<${style.value}>`);
  page.focus();
  touched();
  reflect();
};

document.getElementById("link").addEventListener("mousedown", (e) => e.preventDefault());
document.getElementById("link").onclick = () => {
  const sel = getSelection();
  if (!sel || sel.isCollapsed) return said("Select the words the link should be on.", true);
  const href = prompt("Link to:", "https://");
  if (!href) return;
  // The same two schemes `richtext.js` will read back. Anything else would be
  // written to the file and silently dropped on the way in, which is worse than
  // refusing it here.
  if (!/^(https?:\/\/|mailto:)/.test(href)) return said("Links can be http, https or mailto.", true);
  document.execCommand("createLink", false, href);
  touched();
};

/** Toolbar state, from wherever the caret is. */
function reflect() {
  for (const button of document.querySelectorAll("[data-cmd]")) {
    const cmd = button.dataset.cmd;
    if (cmd === "indent") continue;                       // always available
    if (cmd === "outdent") {
      // Nothing to come back from at the left margin, and that is worth
      // showing rather than letting the button look live and do nothing.
      button.disabled = !inList() && !inQuote();
      continue;
    }
    try {
      button.classList.toggle("on", document.queryCommandState(cmd));
    } catch { /* removeFormat has no state */ }
  }
  const list = inList();
  for (const button of document.querySelectorAll("[data-list]")) {
    const want = button.dataset.list;
    const is = list && (want === "ol" ? list.tagName === "OL"
      : want === "check" ? list.tagName === "UL" && list.dataset.check === "1"
      : list.tagName === "UL" && list.dataset.check !== "1");
    button.classList.toggle("on", Boolean(is));
  }
  const cell = inCell();
  tabletools.hidden = !cell;
  if (cell) {
    const how = cell.dataset.align || "as written";
    tabletools.querySelector('[data-table="align"]').textContent = `Align: ${how}`;
  }

  const at = block();
  const language = at?.querySelector?.("code")?.dataset.language;
  style.value = at && language === "calc" ? "calc"
    : at && ["H1", "H2", "H3", "BLOCKQUOTE", "PRE"].includes(at.tagName) ? at.tagName.toLowerCase()
    : "p";
}

document.addEventListener("selectionchange", () => {
  if (document.activeElement === page) reflect();
});

/*
 * Ticking a box.
 *
 * The box is drawn by CSS in the item's left padding, so there is no element to
 * click — the hit test is where in the item the click landed. Which sounds
 * fragile and is not: it is one number, it is the same number the stylesheet
 * uses, and the alternative is a real `<input>` living inside a contenteditable,
 * where the caret can be placed beside it and it can be deleted by backspace.
 */
page.addEventListener("click", (e) => {
  const li = e.target.closest?.("li");
  if (!li || li.parentElement?.dataset.check !== "1") return;
  const box = li.getBoundingClientRect();
  if (e.clientX - box.left > 22) return;
  li.dataset.done = li.dataset.done === "1" ? "0" : "1";
  touched();
});

page.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
    e.preventDefault();
    void save();
    return;
  }
  /*
   * Tab indents, and Shift+Tab at the left margin gives the keyboard back.
   *
   * Trapping Tab everywhere would leave somebody working without a mouse stuck
   * inside the page, so the one gesture that has nothing to do — outdenting a
   * block already at level zero — is allowed through to move focus instead.
   */
  /*
   * Tab in a table moves to the next cell, which is what Tab means in every
   * table anybody has used — and it beats indenting a cell, which Markdown
   * could not write down anyway. Off the end it makes a new row, so a table can
   * be filled in without touching the mouse.
   */
  const cell = inCell();
  if (e.key === "Tab" && cell) {
    e.preventDefault();
    const cells = [...page.querySelectorAll("th, td")].filter((c) => c.closest("table") === cell.closest("table"));
    const at = cells.indexOf(cell);
    const next = e.shiftKey ? cells[at - 1] : cells[at + 1];
    if (next) return caretInto(next);
    if (e.shiftKey) return;
    TABLE_DOES["row-below"](cell, cell.parentElement, cell.closest("table"));
    square(cell.closest("table"));
    touched();
    return reflect();
  }

  if (e.key === "Tab") {
    if (e.shiftKey && !inList() && !inQuote()) return;
    e.preventDefault();
    document.execCommand(e.shiftKey ? "outdent" : "indent", false, null);
    touched();
    reflect();
  }
});

/*
 * Pasted text arrives as text.
 *
 * A paste from a browser brings fonts, colors, class names and occasionally a
 * whole stylesheet, none of which survives the trip to Markdown and all of which
 * makes the page look wrong in the meantime. The plain text is what round-trips,
 * so that is what is kept — and a paste that is itself Markdown is parsed,
 * which is how a note from somewhere else arrives with its headings intact.
 */
page.addEventListener("paste", (e) => {
  const text = e.clipboardData?.getData("text/plain");
  if (text === undefined) return;
  e.preventDefault();
  const looksMarked = /(^|\n)\s*(#{1,3} |[-*+] |\d+[.)] |> |```)/.test(text);
  if (looksMarked) {
    const frag = fromMarkdown(text);
    const range = getSelection().getRangeAt(0);
    range.deleteContents();
    range.insertNode(frag);
    getSelection().collapseToEnd();
  } else {
    document.execCommand("insertText", false, text);
  }
  touched();
});

/* ------------------------------------------------------------- the desk */

/*
 * Frosting is the desk's, not this surface's — the same arrangement the canvas
 * has, down to asking rather than waiting to be told, because the desk's
 * announcement can happen before this listener exists.
 */
addEventListener("message", (e) => {
  if (e.data?.talaria !== "frost") return;
  document.documentElement.classList.toggle("solid", !e.data.on);
});
if (window.parent !== window) window.parent.postMessage({ talaria: "frost?" }, "*");

// Whatever was last written, which is almost always what somebody came back for.
(async () => {
  try {
    const rows = await get("/shell/writing");
    await load(rows[0]?.name || "Untitled.md");
  } catch (err) {
    said(String(err.message || err), true);
    page.replaceChildren(fromMarkdown(""));
  }
  reflect();
})();

// Nothing in flight when the desk moves on.
addEventListener("blur", () => { if (dirty) void save(); });
</script>
