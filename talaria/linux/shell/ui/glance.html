<!doctype html>
<meta charset="utf8">
<title>Glance</title>
<link rel="stylesheet" href="/ui/panel.css">
<div class="chat">
  <header class="chat-head">
    <span class="dot"></span>
    <span class="who-title">Glance</span>
    <span class="fine" id="source"></span>
  </header>
  <div class="pane" id="body" data-context><div class="note">Waiting for something to look at…</div></div>
</div>

<script type="module">
import { get, post, complain, el, typeLabel } from "/ui/api.js";

const body = document.getElementById("body");
const source = document.getElementById("source");

/*
 * Called by the shell rather than by anything on this page.
 *
 * The rungs are subprocesses and an accessibility tree — none of which a web
 * page can reach — so the shell climbs the ladder and hands the result down.
 * Passed in through `runJavaScript` rather than through the URL: the argument
 * is whatever the user had selected a second ago, and a query string is a place
 * things get logged.
 */
window.glanceAsk = async (reading) => {
  source.textContent = reading.rung ? `via ${reading.rung}` : "";
  body.innerHTML = "";

  if (!reading.text) {
    // The two failures are told apart on purpose. "We did not look" is a
    // promise being kept and should read like one; "nothing was selected" is
    // just a quiet moment.
    const note = el("div", "placeholder");
    note.appendChild(el("p", null, reading.why || "Nothing to look at."));
    if (reading.rung === "blindlist") {
      note.appendChild(el("p", "fine",
        "Talaria does not read password managers or keyring windows. Not the text, " +
        "not the title — the promise is that we did not look, rather than that we " +
        "looked and discarded it."));
    } else {
      note.appendChild(el("p", "fine",
        "Select some text in the window you are working in, then open Glance again."));
    }
    body.appendChild(note);
    return;
  }

  const asked = el("div", "asked");
  asked.appendChild(el("span", "fine", "Looking at"));
  asked.appendChild(el("q", null, reading.text.slice(0, 180) + (reading.text.length > 180 ? "…" : "")));
  body.appendChild(asked);

  const waiting = el("div", "note", "Reading the library…");
  body.appendChild(waiting);

  try {
    const hits = await get(`/glance?q=${encodeURIComponent(reading.text)}&k=24`);
    waiting.remove();
    show(hits, reading.settings || {});
  } catch (err) {
    waiting.remove();
    complain(body, err);
  }
};

/*
 * Where a hit belongs, ported from `Daemon.GlanceSection.of`.
 *
 * The order of the tests is the whole design, and the Mac says why: done is
 * checked first because it is the strongest statement that something needs no
 * attention — a finished task that happens to be due tomorrow and scores well
 * is still finished, and letting either of those pull it back into the main
 * list would rank it above things you can still act on.
 */
function sectionOf(hit, s) {
  const b = hit.block || {};
  if (s.separateDone && b.completion?.done === true) return "done";
  if (!isAboveFold(b, !!s.undatedFurtherOut, s.horizon)) return "furtherOut";
  // Zero is off rather than "everything qualifies", so a library that has never
  // set a threshold behaves exactly as it did before.
  if (s.threshold > 0 && (hit.score ?? 0) < s.threshold) return "lessSimilar";
  // The reader's own split, and not one the Mac makes: something with a status
  // is something you can act on, and it goes first. Everything else is context
  // and waits behind a fold.
  return b.completable ? "main" : "other";
}

function datesOf(b) {
  return [b.schedule?.start?.value, b.schedule?.end?.value].filter(Boolean);
}

/*
 * Near is a window around today: `horizon` days ahead, and a fixed week behind.
 *
 * The week behind is not configurable on purpose. It is there so something that
 * slipped a few days stays where you can see it, and a person who shortens the
 * horizon is saying "show me less of the future", not "hide what I have already
 * missed". The Mac fixes both at seven and twenty-one; only the half somebody
 * asked about moves.
 *
 * String comparison is correct for ISO days and needs no parsing — the Mac's
 * note, and the reason there is no date arithmetic here beyond the offsets.
 */
function isNear(b, horizon) {
  const dates = datesOf(b);
  if (!dates.length) return true;
  const day = (offset) => new Date(Date.now() + offset * 86400000).toISOString().slice(0, 10);
  const today = day(0), from = day(-7), to = day(horizon);
  const on = dates.map(d => String(d).slice(0, 10));
  return on.some(d => d >= from && d <= to)
      || (on.some(d => d <= today) && on.some(d => d >= today));
}

function isAboveFold(b, undatedBelow, horizon) {
  return datesOf(b).length ? isNear(b, horizon) : !undatedBelow;
}

const SECTIONS = [
  ["main", null],                                  // never folded
  ["other", "Other items"],
  ["furtherOut", null],   // labelled at render time — see `show`
  ["lessSimilar", "Less similar"],
  ["done", "Done"],
];

function show(hits, settings) {
  if (!hits?.length) {
    body.appendChild(el("div", "note", "Nothing in the library looks like this."));
    return;
  }
  const s = {
    threshold: Number(settings.threshold || 0),
    separateDone: !!settings.separateDone,
    undatedFurtherOut: !!settings.undatedFurtherOut,
    horizon: Number(settings.horizon) > 0 ? Number(settings.horizon) : 21,
  };

  const buckets = {};
  for (const hit of hits) {
    const where = sectionOf(hit, s);
    (buckets[where] = buckets[where] || []).push(hit);
  }

  for (const [key, label] of SECTIONS) {
    const held = buckets[key];
    if (!held?.length) continue;
    if (key === "main") {
      for (const hit of held) body.appendChild(card(hit));
      continue;
    }
    // Named with the number, because the number is now somebody's choice and a
    // fold that says "further out" without saying further than what is asking
    // the reader to remember a setting.
    const heading = key === "furtherOut"
      ? `Beyond ${s.horizon} days${s.undatedFurtherOut ? ", or undated" : ""}`
      : label;
    body.appendChild(fold(heading, held));
  }

  // Everything was folded away, which reads as "nothing found" unless it says
  // otherwise. The Mac unfolds the first section with anything in it for the
  // same reason.
  if (!buckets.main?.length) {
    const first = body.querySelector("details");
    if (first) first.open = true;
  }
}

/* A folded section. Closed by default, because these are the things you did not
 * ask about — and independently, so opening "further out" to find a date does
 * not also unfurl everything that scored badly. */
function fold(label, held) {
  const box = el("details", "fold");
  const summary = el("summary");
  summary.appendChild(el("span", null, label));
  summary.appendChild(el("span", "count", String(held.length)));
  box.appendChild(summary);
  for (const hit of held) box.appendChild(card(hit));
  return box;
}

function card(hit) {
  const b = hit.block || {};
  const done = !!b.completion?.done;
  const card = el("div", "card" + (done ? " done" : ""));

  // The score is shown rather than hidden. The daemon's own settings panel
  // tells you to "glance at a few and see where the useful ones stop", which is
  // advice you can only follow if the numbers are on screen.
  const score = el("span", "score", (hit.score ?? 0).toFixed(2));
  score.title = "similarity";
  card.appendChild(score);

  /*
   * Anything that can be finished can be finished from here.
   *
   * Read through the daemon's `completable` and `completion`, never by asking
   * what the type is called — the repo's first invariant. A note and a person
   * are not unfinished, they are simply not the kind of thing that finishes,
   * and the daemon has already made that distinction.
   */
  if (b.completable) {
    const tick = el("button", "tick", done ? "☑" : "☐");
    tick.title = done ? "Completed — click to undo" : "Mark complete";
    tick.onclick = async (e) => {
      e.stopPropagation();
      tick.disabled = true;
      try {
        await post("/write", { kind: "complete", blockId: b.id });
        // Struck through here rather than by asking again. Glance is a lookup
        // over a query that has already been answered; re-running it to learn
        // one boolean would reorder the list under the pointer.
        const nowDone = !card.classList.contains("done");
        card.classList.toggle("done", nowDone);
        tick.textContent = nowDone ? "☑" : "☐";
        tick.title = nowDone ? "Completed — click to undo" : "Mark complete";
      } catch (err) {
        complain(body, err);
      } finally {
        tick.disabled = false;
      }
    };
    card.appendChild(tick);
  }

  card.appendChild(el("span", "title", b.title || "(untitled)"));
  if (b.schedule?.end?.value) card.appendChild(el("span", "meta", b.schedule.end.value));
  const label = typeLabel(b) || b.kind || "";
  if (label) card.appendChild(el("span", "meta", label));

  if (b.url) {
    card.classList.add("opens");
    card.title = "Open in Hermes Notes";
    card.onclick = (e) => {
      // A click on the box is about the box. Without this, ticking something
      // off also navigated away from the results you were reading.
      if (e.target.closest(".tick, button")) return;
      window.location.href = b.url;
    };
  }
  return card;
}
</script>
