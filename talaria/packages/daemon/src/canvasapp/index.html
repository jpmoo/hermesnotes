<!doctype html>
<meta charset="utf-8">
<title>Canvas</title>
<!--
  The canvas, drawn in a web view.

  The renderer moving out of Swift, a slice at a time. It loads over a custom
  URL scheme the app proxies into the daemon's Unix socket, and reads and writes
  the same `canvas.json` the AppKit surface does — so the two draw one document
  and neither is a copy of the other.

  Here now: nodes, text, links with draggable bends, regions, pictures, and an
  inspector. Still in the app only: snapping guides, zoom and pan, linked-block
  badges, and printing.

  Deliberately no build step and no framework. The daemon runs from source with
  tsx; a page that needs bundling would be the first thing here that cannot be
  edited and reloaded.
-->
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px -apple-system, system-ui, sans-serif; }
  body { background: #f2f2f4; }
  @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #eee; } }
  #surface { position: relative; width: 100%; height: 100%; cursor: default; }
  #hint {
    position: absolute; right: 10px; bottom: 10px; padding: 4px 9px; border-radius: 8px;
    background: rgba(0,0,0,.06); opacity: .8;
  }
  @media (prefers-color-scheme: dark) { #hint { background: rgba(255,255,255,.1); } }
  #edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  /* A region: the extent of what it holds, and a margin. Its name is written
     above the box rather than inside it, so the box is the things and nothing
     else — which is why the padding is the only inset. */
  .region { position: absolute; box-sizing: border-box; border-radius: 10px; }
  .region.selected { outline: 2px solid #5fa4b5; outline-offset: 3px; }
  .region-title {
    position: absolute; left: 0; right: 0; top: -20px; height: 18px;
    font-weight: 600; white-space: pre; overflow: hidden; cursor: text;
  }
  .region-title:empty::before { content: "untitled"; opacity: .45; }

  /* The inspector. In a corner rather than beside the selection: anchored to
     what is picked it would sit over the next thing along about half the time,
     and a panel you have to move things away from is worse than one that is
     always in the same place. */
  #inspector {
    position: absolute; top: 10px; right: 10px; width: 208px; z-index: 5;
    padding: 10px; border-radius: 11px; background: rgba(255,255,255,.92);
    box-shadow: 0 2px 12px rgba(0,0,0,.14); backdrop-filter: blur(8px);
    display: grid; gap: 7px;
  }
  @media (prefers-color-scheme: dark) {
    #inspector { background: rgba(44,44,46,.92); box-shadow: 0 2px 12px rgba(0,0,0,.5); }
  }
  #inspector[hidden] { display: none; }
  #inspector .what { font-weight: 600; opacity: .6; text-transform: uppercase; letter-spacing: .04em; font-size: 10px; }
  #inspector label { display: grid; grid-template-columns: 62px 1fr auto; gap: 6px; align-items: center; }
  #inspector select, #inspector input[type="number"] { width: 100%; }
  #inspector input[type="color"] { width: 100%; height: 20px; padding: 0; border: none; background: none; }
  /* Clearing a colour is a thing a colour input cannot say — it always has one.
     The cross is how "none" gets expressed. */
  #inspector .clear {
    border: none; background: none; cursor: pointer; opacity: .5; font-size: 13px; line-height: 1;
  }
  #inspector .clear:hover { opacity: 1; }
  #inspector .row { display: flex; gap: 4px; }
  #inspector .row button {
    flex: 1; padding: 3px 0; border-radius: 6px; border: 1px solid rgba(128,128,128,.35);
    background: transparent; cursor: pointer; color: inherit;
  }
  #inspector .row button.on { background: #5fa4b5; border-color: #5fa4b5; color: #fff; }

  /* The rectangle drawn while picking several things at once. */
  #marquee {
    position: absolute; border: 1px solid #5fa4b5;
    background: rgba(95,164,181,.12); pointer-events: none; z-index: 4;
  }
  #marquee[hidden] { display: none; }
  .node {
    position: absolute; box-sizing: border-box; display: flex; padding: 6px;
    white-space: pre-wrap; overflow: hidden; border-radius: 2px;
  }
  .node img { width: 100%; height: 100%; object-fit: contain; }
  /* Selection is an outline rather than a border: a border would change the
     box's size and shift the words inside it every time something was picked. */
  .node.selected { outline: 2px solid #5fa4b5; outline-offset: 2px; }
  .node[contenteditable="plaintext-only"] { outline: 2px solid #5fa4b5; outline-offset: 2px; cursor: text; }
  /* What a dragged line would land on. Dropping on something already joined
     cuts the join, so saying which node is under the pointer is the difference
     between connecting on purpose and disconnecting by accident. */
  .node.target { outline: 2px dashed #5fa4b5; outline-offset: 4px; }

  /* The connector, on the selected node. A ring rather than a dot, and larger
     than it looks: `.grab` is the part drawn, the element is the part aimed at,
     and a target the size of the thing it stands for is a target you miss. */
  #handle {
    position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%; cursor: crosshair; z-index: 3;
    background: radial-gradient(circle at center, #5fa4b5 0 4.5px, transparent 5px),
                radial-gradient(circle at center, transparent 0 5.5px, rgba(95,164,181,.25) 6px 8px, transparent 8.5px);
  }
  #handle[hidden] { display: none; }

  /* The bend grip. `.hit` is the invisible fat copy of a line that makes it
     clickable; both re-enable pointing, which the layer above them turns off so
     that a node underneath can still be reached. */
  #edges .hit, #edges .grip { pointer-events: all; }
  #edges .hit { cursor: pointer; }
  #edges .grip { fill: #fff; stroke: #5fa4b5; stroke-width: 1.5; cursor: grab; }
  @media (prefers-color-scheme: dark) { #edges .grip { fill: #1c1c1e; } }
  #status {
    position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; border-radius: 8px;
    background: rgba(0,0,0,.06); font-variant-numeric: tabular-nums;
  }
  @media (prefers-color-scheme: dark) { #status { background: rgba(255,255,255,.1); } }
</style>
<div id="surface"><svg id="edges"></svg><div id="handle" hidden></div><div id="marquee" hidden></div></div>
<div id="inspector" hidden>
  <div class="what" id="i-what"></div>
  <label data-for="shape">Shape
    <select id="i-shape">
      <option value="plain">Label</option>
      <option value="rectangle">Rectangle</option>
      <option value="roundedRectangle">Rounded</option>
      <option value="ellipse">Ellipse</option>
      <option value="triangle">Triangle</option>
      <option value="postIt">Post-it</option>
    </select><span></span>
  </label>
  <label data-for="fill">Fill
    <input type="color" id="i-fill"><button class="clear" data-clear="fill" title="No fill">✕</button>
  </label>
  <label data-for="textColor">Text
    <input type="color" id="i-textColor"><button class="clear" data-clear="textColor" title="Default">✕</button>
  </label>
  <label data-for="stroke">Line
    <input type="color" id="i-stroke"><button class="clear" data-clear="stroke" title="Default">✕</button>
  </label>
  <label data-for="strokeWidth">Weight
    <input type="number" id="i-strokeWidth" min="0" max="20" step="0.5"><span></span>
  </label>
  <label data-for="strokeStyle">Style
    <select id="i-strokeStyle">
      <option value="solid">Solid</option>
      <option value="dashed">Dashed</option>
      <option value="double">Double</option>
    </select><span></span>
  </label>
  <div data-for="hAlign" class="row" id="i-hAlign"></div>
  <div data-for="vAlign" class="row" id="i-vAlign"></div>
</div>
<div id="status">loading…</div>
<div id="hint">double-click to add · drag the ring to join · drag a box round several, then G to group · paste or drop a picture · ⌫ to remove</div>
<script type="module" src="./canvas.js"></script>
